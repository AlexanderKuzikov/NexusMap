<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NexusMap — редактор карт</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1014;
  }
  body {
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
    color: #d9d9d4;
    -webkit-user-select: none;
    user-select: none;
    /* Панели стоят в потоке, а не поверх канваса: иначе они закрывают клетки, под которыми
       нельзя рисовать, и «поле вписано в окно» перестаёт быть правдой. */
    display: flex;
    flex-direction: column;
  }
  canvas#view {
    position: absolute;
    inset: 0;
    display: block;
  }
  #stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
  }
  #bar {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    margin: 12px 12px 0;
    padding: 10px;
    background: rgba(16, 18, 24, 0.94);
    border: 1px solid #2f3743;
    border-radius: 12px;
  }
  #brushes {
    display: flex;
    gap: 6px;
  }
  .brush {
    width: 60px;
    height: 60px;
    padding: 0;
    display: grid;
    place-items: center;
    background: #232833;
    border: 1px solid #39414f;
    border-radius: 10px;
    cursor: pointer;
  }
  .brush:hover {
    background: #2a303c;
  }
  .brush[aria-pressed="true"] {
    background: #2f3644;
    box-shadow: inset 0 0 0 2px #9aa4b2;
  }
  .brush:focus-visible,
  .cmd:focus-visible,
  #name:focus-visible {
    outline: 2px solid #6f9bff;
    outline-offset: 1px;
  }
  .cmd {
    padding: 8px 12px;
    background: #2a3040;
    color: #d9d9d4;
    border: 1px solid #39414f;
    border-radius: 8px;
    font: inherit;
    cursor: pointer;
  }
  .cmd:hover {
    background: #333b4d;
  }
  #name {
    width: 120px;
    padding: 7px 9px;
    background: #161a22;
    color: #d9d9d4;
    border: 1px solid #39414f;
    border-radius: 8px;
    font: inherit;
    -webkit-user-select: text;
    user-select: text;
  }
  #bar {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row > label {
    color: #8b94a3;
    font-size: 12px;
  }
  select, input[type="number"] {
    padding: 6px 8px;
    background: #161a22;
    color: #d9d9d4;
    border: 1px solid #39414f;
    border-radius: 8px;
    font: inherit;
  }
  input[type="number"] {
    width: 66px;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .zoom {
    width: 34px;
    font-size: 16px;
    line-height: 1;
    padding: 6px 0;
  }
  #status {
    display: flex;
    gap: 14px;
    padding: 8px 12px;
    background: rgba(16, 18, 24, 0.94);
    border: 1px solid #2f3743;
    border-radius: 10px;
    color: #b9c1cd;
    font-size: 12px;
    white-space: nowrap;
  }
  #status b {
    color: #e6e9ee;
    font-weight: 600;
  }
  #legend {
    padding: 8px 12px;
    background: rgba(16, 18, 24, 0.94);
    border: 1px solid #2f3743;
    border-radius: 10px;
    color: #8b94a3;
    font-size: 12px;
    text-align: right;
  }
  #legend kbd {
    color: #d9d9d4;
    background: #232833;
    border: 1px solid #39414f;
    border-radius: 4px;
    padding: 0 4px;
    font: inherit;
  }
</style>
</head>
<body>
<div id="bar">
  <div class="row">
    <div id="brushes"></div>
    <input id="name" type="text" value="burrow-01" spellcheck="false" autocomplete="off" aria-label="Название карты">
    <button id="save" class="cmd" type="button">Сохранить</button>
    <button id="open" class="cmd" type="button">Открыть</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
  <div class="row">
    <label for="preset">Размер</label>
    <select id="preset" aria-label="Размер поля">
      <option value="96x96">96 × 96</option>
      <option value="96x64">96 × 64</option>
      <option value="64x96">64 × 96</option>
      <option value="64x64">64 × 64</option>
      <option value="48x48">48 × 48</option>
      <option value="32x32">32 × 32</option>
      <option value="custom">свой…</option>
    </select>
    <input id="fieldW" type="number" min="8" max="96" step="1" value="96" aria-label="Ширина поля">
    <input id="fieldH" type="number" min="8" max="96" step="1" value="96" aria-label="Высота поля">
    <label for="brushW">Кисть</label>
    <button id="brushDown" class="cmd zoom" type="button" aria-label="Уже">−</button>
    <input id="brushW" type="number" min="1" max="16" step="1" value="1" aria-label="Ширина кисти в клетках">
    <button id="brushUp" class="cmd zoom" type="button" aria-label="Шире">+</button>
    <span class="row" style="gap:4px">
      <button id="zoomOut" class="cmd zoom" type="button" aria-label="Отдалить">−</button>
      <button id="zoomIn" class="cmd zoom" type="button" aria-label="Приблизить">+</button>
      <button id="fitBtn" class="cmd" type="button">Вписать</button>
    </span>
  </div>
</div>

<div id="stage"><canvas id="view"></canvas></div>

<div id="footer">
  <div id="status">
    <span>Поле <b id="stSize">96 × 96</b></span>
    <span>Клетка <b id="stCell">—</b></span>
    <span>Кисть <b id="stBrush">Дорога</b> <b id="stBrushW">1</b></span>
    <span>Масштаб <b id="stZoom">—</b></span>
  </div>
  <div id="legend">
    <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> вид клетки · <kbd>[</kbd> <kbd>]</kbd> ширина кисти ·
    <kbd>левая</kbd> рисовать · <kbd>правая</kbd> стирать ·
    <kbd>колесо</kbd> зум · <kbd>средняя</kbd> или <kbd>пробел</kbd> сдвиг · <kbd>Ctrl+Z</kbd> отмена
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
